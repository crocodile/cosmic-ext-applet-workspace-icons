t-anchor="middle" font-size="15px" style="fill: rgb(23, 43, 77);"><text x="291.4" y="189.5">Button width = 75.8</text></g></g></g><g data-cell-id="32"><g transform="translate(0.5,0.5)"><path d="M 524.42 524 L 537.18 524" fill="none" stroke="#526581" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 101, 129);"/><path d="M 519.92 524 L 525.92 521 L 524.42 524 L 525.92 527 Z" fill="#526581" stroke="#526581" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 129); stroke: rgb(82, 101, 129);"/><path d="M 541.68 524 L 535.68 527 L 537.18 524 L 535.68 521 Z" fill="#526581" stroke="#526581" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 129); stroke: rgb(82, 101, 129);"/></g></g><g data-cell-id="33"><g><rect x="400.8" y="497" width="260" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(23, 43, 77);"><text x="530.8" y="515.5">Gap = 4</text></g></g></g><g data-cell-id="34"><g transform="translate(0.5,0.5)"><path d="M 810.8 241.62 L 810.8 470.38" fill="none" stroke="#526581" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(82, 101, 129);"/><path d="M 810.8 237.12 L 813.8 243.12 L 810.8 241.62 L 807.8 243.12 Z" fill="#526581" stroke="#526581" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 129); stroke: rgb(82, 101, 129);"/><path d="M 810.8 474.88 L 807.8 468.88 L 810.8 470.38 L 813.8 468.88 Z" fill="#526581" stroke="#526581" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(82, 101, 129); stroke: rgb(82, 101, 129);"/></g></g><g data-cell-id="35"><g><rect x="820.8" y="342" width="150" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="15px" style="fill: rgb(23, 43, 77);"><text x="822.8" y="362.5">C = 40</text></g></g></g><g data-cell-id="36"><g><rect x="835" y="185" width="320" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="837" y="206">List edges = 2 each</text></g></g></g><g data-cell-id="37"><g><rect x="64" y="486" width="48" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="88" y="507">8</text></g></g></g><g data-cell-id="38"><g><rect x="112" y="486" width="156" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="190" y="507">Number: 26</text></g></g></g><g data-cell-id="39"><g><rect x="244" y="526" width="190" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(23, 43, 77);"><text x="339" y="546.5">4 | 1 | 4 + 4</text></g></g></g><g data-cell-id="40"><g><rect x="334" y="486" width="150" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="409" y="507">Icon: 20.8</text></g></g></g><g data-cell-id="41"><g><rect x="470.8" y="486" width="48" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="494.8" y="507">8</text></g></g></g><g data-cell-id="42"><g><rect x="36" y="600" width="1128" height="169" rx="10" ry="10" fill="#f5f7fb" stroke="#dfe5ee" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 247, 251); stroke: rgb(223, 229, 238);"/></g></g><g data-cell-id="43"><g><rect x="54" y="613" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="633">SOURCE  Button padding = 0. Content edges = 8 each; number/divider/app-group gaps = 4 each.</text></g></g></g><g data-cell-id="44"><g><rect x="54" y="642" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="662">SOURCE  App group adds 4 before the first icon, 0 after it, and 2 on both cross-axis sides.</text></g></g></g><g data-cell-id="45"><g><rect x="54" y="671" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="691">CALCULATED  75.8 = 8 + 26 + 4 + 1 + 4 + 4 + 20.8 + 8.</text></g></g></g><g data-cell-id="46"><g><rect x="54" y="700" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="720">CALCULATED  Icon frame is centred vertically: top = bottom = (40 - 20.8) / 2 = 9.6.</text></g></g></g><g data-cell-id="47"><g><rect x="54" y="729" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="749">READING  Solid artwork is illustrative; the dashed green frame is the measurable widget boundary.</text></g></g></g></g></g></g></svg>