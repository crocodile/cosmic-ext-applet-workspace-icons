="380" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="42" y="626">Ink: 10/16 of frame = 12.5</text></g></g></g><g data-cell-id="36"><g><rect x="415" y="605" width="420" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="417" y="626">Ink diameter: 8/24 x 20 = 6.667</text></g></g></g><g data-cell-id="37"><g><rect x="840" y="605" width="340" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="842" y="626">Dot envelope: 6.667</text></g></g></g><g data-cell-id="38"><g><rect x="36" y="665" width="1128" height="140" rx="10" ry="10" fill="#f5f7fb" stroke="#dfe5ee" stroke-width="1.5" pointer-events="all" style="fill: rgb(245, 247, 251); stroke: rgb(223, 229, 238);"/></g></g><g data-cell-id="39"><g><rect x="54" y="678" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="698">SOURCE  Numbers shown: the empty workspace displays its centred name; major size is B, cross size is C.</text></g></g></g><g data-cell-id="40"><g><rect x="54" y="707" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="727">SOURCE  Empty pinned workspaces use a dot; only the last unpinned workspace uses +.</text></g></g></g><g data-cell-id="41"><g><rect x="54" y="736" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="756">CURRENT  Outlined symbols match the border; inactive filled symbols are transparent cutouts.</text></g></g></g><g data-cell-id="42"><g><rect x="54" y="765" width="1092" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 43, 77);"><text x="56" y="785">COMMENT 1  At 0% spacing with Round corners the + pill is circular; it need not hug the plus ink.</text></g></g></g></g></g></g></svg>