[package]
name = "iced_tiny_skia"
description = "A software renderer for iced on top of tiny-skia"
version = "0.14.0"
edition = "2024"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]

[features]
default = ["x11", "wayland"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg", "resvg"]
geometry = ["iced_graphics/geometry"]
x11 = ["softbuffer/x11", "softbuffer/x11-dlopen"]
wayland = ["softbuffer/wayland", "softbuffer/wayland-dlopen"]

[dependencies]
# Use the same Git source as the app so these remain the same Iced types.
iced_debug = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic" }
iced_graphics = { version = "0.14.0", git = "https://github.com/pop-os/libcosmic" }

bytemuck = { version = "1.0", features = ["derive"] }
cosmic-text = "0.19"
kurbo = "0.10"
log = "0.4"
rustc-hash = "2.0"
softbuffer = { git = "https://github.com/pop-os/softbuffer", tag = "cosmic-4.0" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
resvg = { version = "0.45", optional = true }

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_results = "deny"

[lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
